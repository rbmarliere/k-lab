DEFAULTS IF NOT DEFINED GREP_OPT
GREP_OPT := -F

DEFAULTS

# DO_TEST_PATTERN_* only key off the captured log text.
# They do not preserve TEST_BIN's exit status.
DO_TEST_SIMPLE = ${SSH} sh -c '${PREP_TEST} ${TEST_BIN}'
DO_TEST_PATTERN_FAIL = ${SSH} sh -c '${PREP_TEST} ${TEST_BIN} 2>&1 | tee /tmp/log; grep ${GREP_OPT} "${PATTERN}" /tmp/log && exit 1 || exit 0'
DO_TEST_PATTERN_OK = ${SSH} sh -c '${PREP_TEST} ${TEST_BIN} 2>&1 | tee /tmp/log; grep ${GREP_OPT} "${PATTERN}" /tmp/log'
# NOTE: escape quotes inside PATTERN (' -> '\'')
# NOTE: if defined, PREP_TEST must end in && or ;

# The three DO_TEST_* macros above are only referenced from TEST_START
# blocks gated on specific TEST values (e.g. boot/chroot-boot/bpf/suse in
# include/suse.conf and tests/smoke/test). Runs that never hit those
# blocks (e.g. a plain "build" TEST) would otherwise never dereference
# these options, causing ktest.pl to flag them as unused/possible typos.
# This unconditional reference marks them as used regardless of which
# TEST_START block ends up active.
_PATTERNS_USED := ${DO_TEST_SIMPLE} ${DO_TEST_PATTERN_OK} ${DO_TEST_PATTERN_FAIL}
