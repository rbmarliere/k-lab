DEFAULTS IF NOT DEFINED GREP_OPT
GREP_OPT := -F

# DO_TEST_PATTERN_* only key off the captured log text.
# They do not preserve TEST_BIN's exit status.
DO_TEST_SIMPLE = ${SSH} sh -c '${PREP_TEST} ${TEST_BIN}'
DO_TEST_PATTERN_FAIL = ${SSH} sh -c '${PREP_TEST} ${TEST_BIN} 2>&1 | tee /tmp/log; grep ${GREP_OPT} "${PATTERN}" /tmp/log && exit 1 || exit 0'
DO_TEST_PATTERN_OK = ${SSH} sh -c '${PREP_TEST} ${TEST_BIN} 2>&1 | tee /tmp/log; grep ${GREP_OPT} "${PATTERN}" /tmp/log'
# NOTE: escape quotes inside PATTERN (' -> '\'')
# NOTE: if defined, PREP_TEST must end in && or ;
