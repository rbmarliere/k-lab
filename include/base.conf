DEFAULTS

INCLUDE ../setup.conf

CONFIG_DIR := ${THIS_DIR}/config

TOOLS_DIR := ${THIS_DIR}/tools
ENV := ${ENV} TOOLS_DIR=${TOOLS_DIR}

BUILD_DIR = ${PWD}
ENV := ${ENV} BUILD_DIR=${BUILD_DIR}

BUILD_OPTIONS := ${shell echo -j$(nproc)}
ENV := ${ENV} BUILD_OPTIONS=${BUILD_OPTIONS}

DEFAULTS IF NOT DEFINED COMPILE_COMMANDS
COMPILE_COMMANDS = 0

DEFAULTS IF NOT DEFINED CC
CC =

DEFAULTS IF NOT DEFINED HOSTCC
HOSTCC =

DEFAULTS IF NOT DEFINED HOSTCFLAGS
HOSTCFLAGS =

DEFAULTS
ENV := ${ENV} CC=${CC} HOSTCC=${HOSTCC} HOSTCFLAGS=${HOSTCFLAGS} COMPILE_COMMANDS=${COMPILE_COMMANDS}

LOCALVERSION = -kt
STORE_FAILURES = ${TMP_DIR}/failures
STORE_SUCCESSES = ${TMP_DIR}/successes
LOG_FILE = ${TMP_DIR}/kt.log
CLEAR_LOG = 1

PRE_KTEST_CHAIN := ${SETENV} ${THIS_DIR}/hooks/pre-ktest
PRE_BUILD_CHAIN := DEPS="bc binutils bison busybox diff flex gawk gcc grep kmod libdw libelf libssl make pahole procps rsync ssh tar vim util-linux ${DEPS}" ${RUN} ${THIS_DIR}/hooks/pre-build
POST_BUILD_CHAIN := ${RUN} ${THIS_DIR}/hooks/post-build
PRE_INSTALL_CHAIN := ${RUN} ${THIS_DIR}/hooks/pre-install
POST_INSTALL_CHAIN := ${RUN} ${THIS_DIR}/hooks/post-install
PRE_TEST_CHAIN := ${RUN} ${THIS_DIR}/hooks/pre-test
POST_TEST_CHAIN := ${RUN} ${THIS_DIR}/hooks/post-test
POST_KTEST_CHAIN := ${RUN} ${THIS_DIR}/hooks/post-ktest

# TEST SPECIFIC HOOKS
PRE_KTEST_APPEND = true
PRE_BUILD_APPEND = true
POST_BUILD_APPEND = true
PRE_INSTALL_APPEND = true
POST_INSTALL_APPEND = true
PRE_TEST_APPEND = true
POST_TEST_APPEND = true
POST_KTEST_APPEND = true
