DEFAULTS IF NOT DEFINED ROOT
ROOT := 0

DEFAULTS IF NOT DEFINED AUTO_INSTALL_DEPS
AUTO_INSTALL_DEPS = 0

DEFAULTS IF NOT DEFINED BUILD_IN_ROOT
BUILD_IN_ROOT = 0

DEFAULTS OVERRIDE

ENV := ${ENV} ROOT="${ROOT}"
ENV := ${ENV} AUTO_INSTALL_DEPS=${AUTO_INSTALL_DEPS}
ENV := ${ENV} BUILD_IN_ROOT=${BUILD_IN_ROOT}

DEPS := ${DEPS} bc binutils bison flex gcc gxx libdw libelf libssl make rsync ssh tar vim
INSTALL_DEPS = ${DEPS}

PRE_TEST_CHAIN := ${PRE_TEST_CHAIN} && ${RUN_HOOK} ${THIS_DIR}/hooks/rootfs/pre_test
PRE_KTEST_CHAIN := ${PRE_KTEST_CHAIN} && ${RUN_HOOK} ${THIS_DIR}/hooks/rootfs/pre_ktest
POST_BUILD_CHAIN := ${POST_BUILD_CHAIN} && ${RUN_HOOK} ${THIS_DIR}/hooks/rootfs/post_build
POST_TEST_CHAIN := ${POST_TEST_CHAIN} && ${RUN_HOOK} ${THIS_DIR}/hooks/rootfs/post_test
POST_KTEST_CHAIN := ${POST_KTEST_CHAIN} && ${RUN_HOOK} ${THIS_DIR}/hooks/rootfs/post_ktest
