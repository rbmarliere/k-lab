# ROOT_DISK is a disk image passed straight to virtme-ng's --root-disk (see
# bin/vng/cmd); "0" means unset (fine for build-only tests that never boot a
# VM). CHROOT_BUILD is unrelated to ROOT_DISK: it chroots into CHROOT (see
# include/cross.conf) and builds there with CHROOT's own native toolchain,
# transparently emulated for foreign arches via the host's
# qemu-user/binfmt_misc registration (see bin/chroot/*).
DEFAULTS IF NOT DEFINED ROOT_DISK
ROOT_DISK := 0

DEFAULTS IF NOT DEFINED CHROOT_BUILD
CHROOT_BUILD = 0

DEFAULTS OVERRIDE

ENV := ${ENV} ROOT_DISK="${ROOT_DISK}"
ENV := ${ENV} CHROOT_BUILD=${CHROOT_BUILD}

PRE_BUILD_CHAIN := ${PRE_BUILD_CHAIN} && ${RUN} ${THIS_DIR}/hooks/chroot/pre-build
POST_BUILD_CHAIN := ${POST_BUILD_CHAIN} && ${RUN} ${THIS_DIR}/hooks/chroot/post-build
# Safety net: ktest.pl skips POST_BUILD_CHAIN when the build fails before
# reaching the actual build phase, so also clean up (idempotently) in
# POST_KTEST_CHAIN, which always runs regardless of outcome.
POST_KTEST_CHAIN := ${POST_KTEST_CHAIN} && ${RUN} ${THIS_DIR}/hooks/chroot/post-ktest
