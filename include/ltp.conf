# Use ${BUILD_LTP} in POST_BUILD_APPEND. LTP builds out of tree in
# LTP_BUILD_DIR, outside OUTPUT_DIR so kernel cleaning keeps it incremental,
# and installs into ${OUTPUT_DIR}/ltp, which the guest sees as /mnt/build/ltp.
# CHROOT_USER selects the build root.
DEFAULTS IF NOT DEFINED LTP_DIR
LTP_DIR = ${LTP_GIT}

DEFAULTS IF NOT DEFINED LTP_BUILD_DIR
LTP_BUILD_DIR = ${TMP_DIR}/ltp

DEFAULTS IF NOT DEFINED LTP_CONFIGURE_OPTIONS
LTP_CONFIGURE_OPTIONS =

DEFAULTS IF NOT DEFINED LTP_BUILD_OPTIONS
LTP_BUILD_OPTIONS = -j$(nproc)

DEFAULTS
LTP_ENV = LTP_DIR="${LTP_DIR}" LTP_BUILD_DIR="${LTP_BUILD_DIR}" LTP_CONFIGURE_OPTIONS="${LTP_CONFIGURE_OPTIONS}" LTP_BUILD_OPTIONS="${LTP_BUILD_OPTIONS}"
BUILD_LTP = ${RUN} ${LTP_ENV} ${THIS_DIR}/bin/ltp
