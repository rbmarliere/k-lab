TOOLS_DIR := ${KLAB_DIR}/tools

DEFAULTS IF NOT DEFINED ARCH
ARCH := ${shell uname -m}

DEFAULTS
KLAB_ARCH := ${shell ${KLAB_DIR}/bin/cross normalize-arch "${ARCH}"}
INCLUDE ${KLAB_DIR}/setup.conf

DEFAULTS IF NOT DEFINED CROSS_COMPILE
CROSS_COMPILE =

DEFAULTS IF NOT DEFINED CHROOT_KERNEL
CHROOT_KERNEL =

DEFAULTS IF NOT DEFINED CHROOT_USER
CHROOT_USER = ${CHROOT_KERNEL}

DEFAULTS IF NOT DEFINED ROOT_DISK
ROOT_DISK =

DEFAULTS IF NOT DEFINED VNG
VNG = ${TOOLS_DIR}/virtme-ng/vng

DEFAULTS IF NOT DEFINED BUSYBOX
BUSYBOX = ${TOOLS_DIR}/busybox-static-builder/${KLAB_ARCH}/bin/busybox

DEFAULTS IF NOT DEFINED CC
CC =

DEFAULTS IF NOT DEFINED HOSTCC
HOSTCC =

DEFAULTS IF NOT DEFINED HOSTCFLAGS
HOSTCFLAGS =

DEFAULTS IF NOT DEFINED COMPILE_COMMANDS
COMPILE_COMMANDS = 1

DEFAULTS IF NOT DEFINED VNG_PORT
VNG_PORT = 22000

DEFAULTS IF NOT DEFINED VNG_MEM
VNG_MEM = 1G

DEFAULTS IF NOT DEFINED VNG_ROOT_DEV
VNG_ROOT_DEV = /dev/vda

DEFAULTS IF NOT DEFINED VNG_ROOT_FSTYPE
VNG_ROOT_FSTYPE = ext4

DEFAULTS IF NOT DEFINED VNG_SNAPSHOT
VNG_SNAPSHOT = 1

DEFAULTS IF NOT DEFINED VNG_QEMU_OPTS
VNG_QEMU_OPTS =

DEFAULTS IF NOT DEFINED VNG_ARGS
VNG_ARGS =

DEFAULTS IF NOT DEFINED BUILD_TARGET
BUILD_TARGET = ${shell ${KLAB_DIR}/bin/cross build-target "${ARCH}"}

DEFAULTS
BUILD_DIR = ${PWD}
OUTPUT_DIR = ${TMP_DIR}/build
BUILD_OPTIONS = ${shell echo -j$(nproc)}
LOCALVERSION = -kt

SSH_USER = root
TARGET_IMAGE = /boot/vmlinuz-test
NO_INSTALL = 1
MIN_CONFIG = ${TMP_DIR}/min.config
STORE_FAILURES = ${TMP_DIR}/failures
STORE_SUCCESSES = ${TMP_DIR}/successes
LOG_FILE = ${TMP_DIR}/ktestlog
EMAIL_ON_ERROR = 0
CLEAR_LOG = 1

BUILD_ENV = BIN="${KLAB_DIR}/bin" BUILD_DIR="${BUILD_DIR}" OUTPUT_DIR="${OUTPUT_DIR}" TMP_DIR="${TMP_DIR}" ARCH="${KLAB_ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" CHROOT_KERNEL="${CHROOT_KERNEL}" CHROOT_USER="${CHROOT_USER}" CC="${CC}" HOSTCC="${HOSTCC}" HOSTCFLAGS="${HOSTCFLAGS}" COMPILE_COMMANDS="${COMPILE_COMMANDS}"
VNG_ENV = VNG="${VNG}" VNG_SNAPSHOT="${VNG_SNAPSHOT}" VNG_QEMU_OPTS="${VNG_QEMU_OPTS}" BUSYBOX="${BUSYBOX}" VNG_PORT="${VNG_PORT}" VNG_MEM="${VNG_MEM}" VNG_ROOT_DEV="${VNG_ROOT_DEV}" VNG_ROOT_FSTYPE="${VNG_ROOT_FSTYPE}" ROOT_DISK="${ROOT_DISK}"
RUN = env ${BUILD_ENV} ${VNG_ENV}
MAKE_CMD = ${RUN} ${KLAB_DIR}/bin/make
RUN_USER := ${RUN} env -u ARCH -u CROSS_COMPILE -u CC -u HOSTCC -u HOSTCFLAGS CHROOT="${CHROOT_USER}" ${KLAB_DIR}/bin/chroot
SSH = ${RUN} ${KLAB_DIR}/bin/vm exec
SSH_EXEC = ${SSH} $SSH_COMMAND
CONSOLE = ${RUN} ${KLAB_DIR}/bin/vm console
SUCCESS_LINE = virtme(-ng)?-init: starting script
CLOSE_CONSOLE_SIGNAL = TERM

POWER_CYCLE = ${RUN} ${KLAB_DIR}/bin/vm start ${VNG_ARGS}
POWER_OFF = ${RUN} ${KLAB_DIR}/bin/vm stop
REBOOT = ${POWER_CYCLE}
REBOOT_TYPE = script
REBOOT_RETURN_CODE = 0
REBOOT_SUCCESS_LINE = ${SUCCESS_LINE}
REBOOT_ON_SUCCESS = 0
REBOOT_ON_ERROR = 0

PRE_KTEST_APPEND = true
PRE_BUILD_APPEND = true
POST_BUILD_APPEND = true
PRE_INSTALL_APPEND = true
POST_INSTALL_APPEND = true
PRE_TEST_APPEND = true
POST_TEST_APPEND = true
POST_KTEST_APPEND = true

PRE_KTEST = ${RUN} ${KLAB_DIR}/hooks/pre-ktest && ${PRE_KTEST_APPEND}
PRE_BUILD = ${PRE_BUILD_APPEND}
POST_BUILD = ${RUN} ${KLAB_DIR}/hooks/post-build && ${POST_BUILD_APPEND}
PRE_INSTALL = ${PRE_INSTALL_APPEND}
POST_INSTALL = ${POST_INSTALL_APPEND}
PRE_TEST = ${PRE_TEST_APPEND}
POST_TEST = ${POST_TEST_APPEND}
POST_KTEST = ${RUN} ${KLAB_DIR}/bin/vm stop && ${POST_KTEST_APPEND}
PRE_KTEST_DIE = 1
PRE_BUILD_DIE = 1
POST_BUILD_DIE = 1
PRE_TEST_DIE = 1
