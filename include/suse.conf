KSOURCE_GIT := /linux/kernel-source

TEST_START IF ${TEST} == suse-no-config
TEST_TYPE = test
TEST = ${DO_TEST_SIMPLE}
SUSE := 1

TEST_START IF ${TEST} == suse
TEST_TYPE = test
TEST = ${DO_TEST_SIMPLE}
SUSE := 1
VERSION = 16
PATCHLEVEL = 1
BUILD_TYPE = useconfig:${KSOURCE_GIT}/${BRANCH}/config/${ARCH}/default

TEST_START IF ${TEST} == suse-only
TEST_TYPE = test
TEST = ${DO_TEST_SIMPLE}
SUSE := 1
VERSION = 16
PATCHLEVEL = 1
BUILD_TYPE = useconfig:${KSOURCE_GIT}/${BRANCH}/config/${ARCH}/default
ADD_CONFIG =

DEFAULTS IF DEFINED SUSE
PRE_KTEST_CHAIN := ${PRE_KTEST_CHAIN} && VERSION=${VERSION} PATCHLEVEL=${PATCHLEVEL} ${RUN} ${THIS_DIR}/hooks/suse/pre_ktest
