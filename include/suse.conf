KSOURCE_GIT := /linux/kernel-source

TEST_START IF ${TEST} == suse-no-config
TEST_TYPE = test
TEST = ${DO_TEST_SIMPLE}
TEST_SUSE := 1

TEST_START IF ${TEST} == tumbleweed
TEST_TYPE = test
TEST = ${DO_TEST_SIMPLE}
TEST_SUSE := 1
BUILD_TYPE = useconfig:${KSOURCE_GIT}/stable/config/${ARCH}/default

TEST_START IF ${TEST} == tumbleweed-only
TEST_TYPE = test
TEST = ${DO_TEST_SIMPLE}
TEST_SUSE := 1
BUILD_TYPE = useconfig:${KSOURCE_GIT}/stable/config/${ARCH}/default
ADD_CONFIG =

TEST_START IF ${TEST} == sl-12.5
TEST_TYPE = test
TEST = ${DO_TEST_SIMPLE}
TEST_SUSE := 1
SUSE_VERSION = 12
SUSE_PATCHLEVEL = 5
BUILD_TYPE = useconfig:${KSOURCE_GIT}/SLE-15-SP7/config/${ARCH}/default

TEST_START IF ${TEST} == sl-12.5-only
