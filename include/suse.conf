KSOURCE_GIT := /linux/kernel-source

DEFAULTS IF ${PROFILE} == suse-no-config
PROFILE_SUSE := 1

DEFAULTS IF ${PROFILE} == tumbleweed
PROFILE_SUSE := 1
PROFILE_BUILD_TYPE := useconfig:${KSOURCE_GIT}/stable/config/${ARCH}/default

DEFAULTS IF ${PROFILE} == tumbleweed-only
PROFILE_SUSE := 1
PROFILE_BUILD_TYPE := useconfig:${KSOURCE_GIT}/stable/config/${ARCH}/default
PROFILE_CLEAR_ADD_CONFIG := 1

DEFAULTS IF ${PROFILE} == sl-12.5
PROFILE_SUSE := 1
PROFILE_VERSION := 12
PROFILE_PATCHLEVEL := 5
PROFILE_BUILD_TYPE := useconfig:${KSOURCE_GIT}/SLE-15-SP7/config/${ARCH}/default

DEFAULTS IF ${PROFILE} == sl-12.5-only
PROFILE_SUSE := 1
PROFILE_VERSION := 12
PROFILE_PATCHLEVEL := 5
PROFILE_BUILD_TYPE := useconfig:${KSOURCE_GIT}/SLE-15-SP7/config/${ARCH}/default
PROFILE_CLEAR_ADD_CONFIG := 1

DEFAULTS IF ${PROFILE} == sl-15.7
PROFILE_SUSE := 1
PROFILE_VERSION := 15
PROFILE_PATCHLEVEL := 7
PROFILE_BUILD_TYPE := useconfig:${KSOURCE_GIT}/SLE-15-SP7/config/${ARCH}/default

DEFAULTS IF ${PROFILE} == sl-15.7-only
PROFILE_SUSE := 1
PROFILE_VERSION := 15
PROFILE_PATCHLEVEL := 7
PROFILE_BUILD_TYPE := useconfig:${KSOURCE_GIT}/SLE-15-SP7/config/${ARCH}/default
PROFILE_CLEAR_ADD_CONFIG := 1

DEFAULTS IF ${PROFILE} == sl-16.0
PROFILE_SUSE := 1
PROFILE_VERSION := 16
PROFILE_PATCHLEVEL := 0
PROFILE_BUILD_TYPE := useconfig:${KSOURCE_GIT}/SL-16.0/config/${ARCH}/default

DEFAULTS IF ${PROFILE} == sl-16.0-only
PROFILE_SUSE := 1
PROFILE_VERSION := 16
PROFILE_PATCHLEVEL := 0
PROFILE_BUILD_TYPE := useconfig:${KSOURCE_GIT}/SL-16.0/config/${ARCH}/default
PROFILE_CLEAR_ADD_CONFIG := 1

DEFAULTS IF ${PROFILE} == sl-16.1
PROFILE_SUSE := 1
PROFILE_VERSION := 16
PROFILE_PATCHLEVEL := 1
PROFILE_BUILD_TYPE := useconfig:${KSOURCE_GIT}/SL-16.1/config/${ARCH}/default

DEFAULTS IF ${PROFILE} == sl-16.1-only
PROFILE_SUSE := 1
PROFILE_VERSION := 16
PROFILE_PATCHLEVEL := 1
PROFILE_BUILD_TYPE := useconfig:${KSOURCE_GIT}/SL-16.1/config/${ARCH}/default
PROFILE_CLEAR_ADD_CONFIG := 1
