DEFAULTS IF NOT DEFINED SUSE_VERSION
SUSE_VERSION =

DEFAULTS IF NOT DEFINED SUSE_PATCHLEVEL
SUSE_PATCHLEVEL =

DEFAULTS IF NOT DEFINED SUSE_FLAVOR
SUSE_FLAVOR = default

DEFAULTS IF NOT DEFINED SELFTEST_BUILD_OPTIONS
SELFTEST_BUILD_OPTIONS = -j$(nproc) BPF_STRICT_BUILD=0

DEFAULTS
SUSE_ARCH := ${shell ${KLAB_DIR}/bin/cross suse-arch "${ARCH}"}

DEFAULTS OVERRIDE
BUILD_TYPE = useconfig:${SUSE_KERNEL_SOURCE_GIT}/${SUSE_BRANCH}/config/${SUSE_ARCH}/default
ADD_CONFIG = ${SUSE_KERNEL_SOURCE_GIT}/${SUSE_BRANCH}/config/${SUSE_ARCH}/${SUSE_FLAVOR}
PRE_KTEST_APPEND = SUSE_VERSION="${SUSE_VERSION}" SUSE_PATCHLEVEL="${SUSE_PATCHLEVEL}" ${RUN} ${KLAB_DIR}/hooks/suse/pre-ktest
