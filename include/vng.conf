VNG_DIR := ${TOOLS_DIR}/virtme-ng

DEFAULTS IF NOT DEFINED VNG_PORT
VNG_PORT = 22000

DEFAULTS IF NOT DEFINED VNG_MEM
VNG_MEM = 1G

DEFAULTS IF NOT DEFINED VNG_ROOT_DEV
VNG_ROOT_DEV = /dev/vda

DEFAULTS IF NOT DEFINED VNG_ROOT_FSTYPE
VNG_ROOT_FSTYPE = ext4

DEFAULTS IF NOT DEFINED KLAB_ID
KLAB_ID := default

DEFAULTS OVERRIDE


MACHINE = ${KLAB_ID}

TMP_DIR = ${THIS_DIR}/tmp/${KLAB_ID}

OUTPUT_DIR = ${TMP_DIR}/build

MIN_CONFIG = ${TMP_DIR}/min.config

CONSOLE = cat ${THIS_DIR}/tmp/${KLAB_ID}/console
SUCCESS_LINE = virtme(-ng)?-init: starting script

SSH_USER = ${shell whoami}
# bin/vng/cmd writes this helper at boot time, already wired up with the
# correct --root-disk/--user root/--ssh-client/port and the same $HOME used
# to boot, so the SSH cache directory it resolves matches the boot's.
SSH = ${RUN} ${TMP_DIR}/vng.ssh
SSH_EXEC = ${SSH} $SSH_COMMAND

POWER_CYCLE = ${RUN} ${THIS_DIR}/bin/vng/stop-vm && ${RUN} ${THIS_DIR}/bin/vng/start-vm ${VNG_ARGS}
POWER_OFF = ${RUN} ${THIS_DIR}/bin/vng/stop-vm -f

REBOOT_ON_SUCCESS = 0
REBOOT_ON_ERROR = 0
REBOOT_TYPE = script
REBOOT = ${POWER_CYCLE}
REBOOT_RETURN_CODE = 0
REBOOT_SUCCESS_LINE = ${SUCCESS_LINE}

# ktest.pl still dereferences TARGET_IMAGE during dry-run even though the vng
# flow never installs a kernel onto a guest filesystem path.
TARGET_IMAGE = /boot/vmlinuz-test
NO_INSTALL = 1

PRE_KTEST_CHAIN := ${PRE_KTEST_CHAIN} && ${RUN} ${THIS_DIR}/hooks/vng/pre-ktest
PRE_BUILD_CHAIN := ${PRE_BUILD_CHAIN} && ${RUN} ${THIS_DIR}/hooks/vng/pre-build
POST_BUILD_CHAIN := ${POST_BUILD_CHAIN} && ${RUN} ${THIS_DIR}/hooks/vng/post-build
POST_KTEST_CHAIN := ${POST_KTEST_CHAIN} && ${RUN} ${THIS_DIR}/hooks/vng/post-ktest
