VNG_DIR := ${THIS_DIR}/virtme-ng
ENV := ${ENV} VNG_DIR=${VNG_DIR}

DEFAULTS IF NOT DEFINED VNG_PORT
VNG_PORT = 22000

DEFAULTS OVERRIDE

ENV := ${ENV} VNG_PORT=${VNG_PORT}

MACHINE = vng_${VNG_PORT}
LOCALVERSION = -${MACHINE}

CONSOLE = cat ${TMP_DIR}/console
SUCCESS_LINE = virtme(-ng)?-init: starting script

SSH_USER = ${shell whoami}
SSH = ${RUN} ${THIS_DIR}/bin/vng/cmd --ssh-client ${VNG_PORT} ${VNG_ARGS} --
SSH_EXEC = ${SSH} $SSH_COMMAND

# umount rootfs, if any, so the host does not leak into vm
VNG_PRE_START = ${RUN} ${THIS_DIR}/bin/rootfs/umount

POWER_CYCLE = ${RUN} ${THIS_DIR}/bin/vng/stop-vm && ${VNG_PRE_START} && ${RUN} ${THIS_DIR}/bin/vng/start-vm ${VNG_ARGS}
POWER_OFF = ${RUN} ${THIS_DIR}/bin/vng/stop-vm -f

REBOOT_ON_SUCCESS = 0
REBOOT_ON_ERROR = 0
REBOOT_TYPE = script
REBOOT = ${POWER_CYCLE}
REBOOT_RETURN_CODE = 0
REBOOT_SUCCESS_LINE = ${SUCCESS_LINE}

BUILD_TARGET = arch/x86/boot/bzImage
TARGET_IMAGE = arch/x86/boot/bzImage
NO_INSTALL = 1
MIN_CONFIGS := ${MIN_CONFIGS} ${TMP_DIR}/vng-min.config

PRE_KTEST_CHAIN := ${PRE_KTEST_CHAIN} && ${RUN_HOOK} ${THIS_DIR}/hooks/vng/pre_ktest
PRE_BUILD_CHAIN := ${PRE_BUILD_CHAIN} && ${RUN_HOOK} ${THIS_DIR}/hooks/vng/pre_build
POST_BUILD_CHAIN := ${POST_BUILD_CHAIN} && ${RUN_HOOK} ${THIS_DIR}/hooks/vng/post_build
POST_KTEST_CHAIN := ${POST_KTEST_CHAIN} && ${RUN_HOOK} ${THIS_DIR}/hooks/vng/post_ktest
