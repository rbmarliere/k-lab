VNG_DIR := ${TOOLS_DIR}/virtme-ng
ENV := ${ENV} VNG_DIR=${VNG_DIR}

DEFAULTS IF NOT DEFINED VNG_PORT
VNG_PORT := 22000

DEFAULTS IF NOT DEFINED VNG_MEM
VNG_MEM = 1G

# KLAB_ID identifies the TMP_DIR/OUTPUT_DIR for this test. kt injects a
# per-test hash here (derived from the test file plus ROOT/ARCH/TEST) so
# distinct tests never share a TMP_DIR and reruns of the same test reuse
# their own build. Direct ktest.pl invocations (bypassing kt) fall back to
# the old behavior of keying off VNG_PORT.
DEFAULTS IF NOT DEFINED KLAB_ID
KLAB_ID := ${VNG_PORT}

DEFAULTS OVERRIDE

ENV := ${ENV} VNG_PORT=${VNG_PORT}
ENV := ${ENV} VNG_MEM=${VNG_MEM}
ENV := ${ENV} KLAB_ID=${KLAB_ID}

MACHINE = ${KLAB_ID}

TMP_DIR = ${THIS_DIR}/tmp/${KLAB_ID}
ENV := ${ENV} TMP_DIR=${TMP_DIR}

OUTPUT_DIR = ${TMP_DIR}/build
ENV := ${ENV} OUTPUT_DIR=${OUTPUT_DIR}

MIN_CONFIG = ${TMP_DIR}/min.config

CONSOLE = cat ${THIS_DIR}/tmp/${KLAB_ID}/console
SUCCESS_LINE = virtme(-ng)?-init: starting script

SSH_USER = ${shell whoami}
SSH = ${RUN} ${THIS_DIR}/bin/vng/cmd --ssh-tcp --ssh-client ${VNG_PORT} --
SSH_EXEC = ${SSH} $SSH_COMMAND

# umount rootfs, if any, so the host does not leak into vm
VNG_PRE_START = ${RUN} ${THIS_DIR}/bin/rootfs/umount

POWER_CYCLE = ${RUN} ${THIS_DIR}/bin/vng/stop-vm && ${VNG_PRE_START} && ${RUN} ${THIS_DIR}/bin/vng/start-vm ${VNG_ARGS}
POWER_OFF = ${RUN} ${THIS_DIR}/bin/vng/stop-vm -f

REBOOT_ON_SUCCESS = 0
REBOOT_ON_ERROR = 0
REBOOT_TYPE = script
REBOOT = ${POWER_CYCLE}
REBOOT_RETURN_CODE = 0
REBOOT_SUCCESS_LINE = ${SUCCESS_LINE}

# ktest.pl still dereferences TARGET_IMAGE during dry-run even though the vng
# flow never installs a kernel onto a guest filesystem path.
TARGET_IMAGE = /boot/vmlinuz-test
NO_INSTALL = 1

PRE_KTEST_CHAIN := ${PRE_KTEST_CHAIN} && ${RUN} ${THIS_DIR}/hooks/vng/pre-ktest
PRE_BUILD_CHAIN := ${PRE_BUILD_CHAIN} && ${RUN} ${THIS_DIR}/hooks/vng/pre-build
POST_BUILD_CHAIN := ${POST_BUILD_CHAIN} && ${RUN} ${THIS_DIR}/hooks/vng/post-build
POST_KTEST_CHAIN := ${POST_KTEST_CHAIN} && ${RUN} ${THIS_DIR}/hooks/vng/post-ktest
