DEFAULTS IF NOT DEFINED VNG
VNG = ${TOOLS_DIR}/virtme-ng/vng

DEFAULTS IF NOT DEFINED BUSYBOX
BUSYBOX = ${TOOLS_DIR}/busybox-static-builder/${KLAB_ARCH}/bin/busybox

DEFAULTS IF NOT DEFINED VNG_PORT
VNG_PORT = 22000

DEFAULTS IF NOT DEFINED VNG_ARGS
VNG_ARGS =

DEFAULTS IF NOT DEFINED VNG_MEM
VNG_MEM = 1G

DEFAULTS IF NOT DEFINED VNG_ROOT_DEV
VNG_ROOT_DEV = /dev/vda

DEFAULTS IF NOT DEFINED VNG_ROOT_FSTYPE
VNG_ROOT_FSTYPE = ext4

DEFAULTS IF NOT DEFINED KLAB_ID
KLAB_ID := default

DEFAULTS OVERRIDE


MACHINE = ${KLAB_ID}

TMP_DIR = ${THIS_DIR}/tmp/${KLAB_ID}

OUTPUT_DIR = ${TMP_DIR}/build

MIN_CONFIG = ${TMP_DIR}/min.config

CONSOLE = ${RUN} ${THIS_DIR}/bin/vm console
SUCCESS_LINE = virtme(-ng)?-init: starting script
CLOSE_CONSOLE_SIGNAL = TERM

SSH_USER = ${shell whoami}
SSH = ${RUN} ${THIS_DIR}/bin/vm exec
SSH_EXEC = ${SSH} $SSH_COMMAND

POWER_CYCLE = ${RUN} ${THIS_DIR}/bin/vm start ${VNG_ARGS}
POWER_OFF = ${RUN} ${THIS_DIR}/bin/vm stop

REBOOT_ON_SUCCESS = 0
REBOOT_ON_ERROR = 0
REBOOT_TYPE = script
REBOOT = ${POWER_CYCLE}
REBOOT_RETURN_CODE = 0
REBOOT_SUCCESS_LINE = ${SUCCESS_LINE}

# ktest.pl still dereferences TARGET_IMAGE during dry-run even though the vng
# flow never installs a kernel onto a guest filesystem path.
TARGET_IMAGE = /boot/vmlinuz-test
NO_INSTALL = 1

POST_KTEST_CHAIN := ${RUN} ${THIS_DIR}/bin/vm stop
