# Set SELFTEST_TARGETS and use ${BUILD_SELFTESTS} in POST_BUILD_APPEND.
# Settings come from MAKE_CMD; these options apply only to the collection build.
DEFAULTS IF NOT DEFINED SELFTEST_TARGETS
SELFTEST_TARGETS =

DEFAULTS IF NOT DEFINED SELFTEST_BUILD_OPTIONS
SELFTEST_BUILD_OPTIONS = -j$(nproc)

DEFAULTS
BUILD_SELFTESTS = test -n "${SELFTEST_TARGETS}" && ${MAKE_CMD} headers && ${MAKE_CMD} ${SELFTEST_BUILD_OPTIONS} -C tools/testing/selftests SKIP_TARGETS= TARGETS="${SELFTEST_TARGETS}" FORCE_TARGETS=1 install
