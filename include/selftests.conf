# Set SELFTEST_TARGETS and use ${BUILD_SELFTESTS} in POST_BUILD_APPEND.
# Headers and complete collections build in CHROOT_USER.
DEFAULTS IF NOT DEFINED SELFTEST_SOURCE
SELFTEST_SOURCE = ${BUILD_DIR}

DEFAULTS IF NOT DEFINED SELFTEST_TARGETS
SELFTEST_TARGETS =

DEFAULTS IF NOT DEFINED SELFTEST_BUILD_OPTIONS
SELFTEST_BUILD_OPTIONS = -j$(nproc)

DEFAULTS
BUILD_SELFTESTS := test -n "${SELFTEST_TARGETS}" && ${RUN} SELFTEST_SOURCE="${SELFTEST_SOURCE}" SELFTEST_TARGETS="${SELFTEST_TARGETS}" ${THIS_DIR}/bin/selftests ${SELFTEST_BUILD_OPTIONS}
