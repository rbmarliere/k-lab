# Set XFSTESTS_SOURCE and use ${BUILD_XFSTESTS} in POST_BUILD_APPEND.
DEFAULTS IF NOT DEFINED XFSTESTS_SOURCE
XFSTESTS_SOURCE =

DEFAULTS IF NOT DEFINED XFSTESTS_BUILD_OPTIONS
XFSTESTS_BUILD_OPTIONS = -j$(nproc)

DEFAULTS
BUILD_XFSTESTS = ${RUN} XFSTESTS_SOURCE="${XFSTESTS_SOURCE}" ${KLAB_DIR}/bin/xfstests ${XFSTESTS_BUILD_OPTIONS}
