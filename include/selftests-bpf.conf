# Shared profile for kernel BPF selftest (tools/testing/selftests/bpf) runs.
#
# Include it AFTER include/defaults.conf; it reuses that stack's OUTPUT_DIR,
# RUN, THIS_DIR, BUILD_DIR and ARCH:
#
#   INCLUDE ../include/defaults.conf
#   INCLUDE ../include/selftests-bpf.conf
#
#   TEST_START
#   TEST_TYPE = test
#   TEST_BIN = ./test_progs -vv -t <subtest>
#   TEST = ${DO_TEST_SIMPLE}
#
# It installs the "bpf" collection during POST_BUILD and prepares the guest to
# run test_progs from the install tree (bpffs mounted, cwd in the install dir).
# The build environment (host, or CHROOT when CHROOT_BUILD=1) must already
# provide the bpf-selftest build deps, e.g. a C++ compiler, dwarves, libdwarf,
# python3-docutils, clang, lld, llvm(+-dev), xxd. k-lab does not install them.
#
# Any of these may be overridden again in the including test's own
# DEFAULTS/TEST_START sections.
DEFAULTS OVERRIDE

TEST_DIR = ${OUTPUT_DIR}/kselftest/kselftest_install/bpf
PREP_TEST = mount bpffs /sys/fs/bpf -t bpf && cd ${TEST_DIR} &&

POST_BUILD_APPEND = ${RUN} ${THIS_DIR}/hooks/selftests/post-build bpf

ADD_CONFIG = ${BUILD_DIR}/tools/testing/selftests/bpf/config ${BUILD_DIR}/tools/testing/selftests/bpf/config.${ARCH}
