DEFAULTS IF DEFINED ARCH
KLAB_ARCH_INPUT := ${ARCH}
KLAB_ARCH := ${shell ${THIS_DIR}/bin/cross normalize-arch "${KLAB_ARCH_INPUT}"}
ELSE
ARCH := ${shell ${THIS_DIR}/bin/cross resolve-arch "${ROOT}"}
KLAB_ARCH := ${ARCH}
DEFAULTS

DEFAULTS IF NOT DEFINED CROSS_COMPILE
CROSS_COMPILE := ${shell ${THIS_DIR}/bin/cross cross-compile "${KLAB_ARCH}"}

KLAB_BUILD_TARGET := ${shell ${THIS_DIR}/bin/cross build-target "${KLAB_ARCH}"}

DEFAULTS IF NOT DEFINED BUILD_TARGET
BUILD_TARGET = ${KLAB_BUILD_TARGET}

DEFAULTS OVERRIDE

ENV := ${ENV} ARCH="${KLAB_ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" BUILD_TARGET="${KLAB_BUILD_TARGET}"
