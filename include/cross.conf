DEFAULTS IF DEFINED ARCH
KLAB_ARCH_INPUT := ${ARCH}
KLAB_ARCH := ${shell ${THIS_DIR}/bin/cross normalize-arch "${KLAB_ARCH_INPUT}"}
DEFAULTS

# CHROOT has no naming convention to infer ARCH from (unlike ROOT_DISK's
# filename), so this tier is only reachable via an explicit "-D CHROOT:=..."
# override (referencing ${CHROOT} here when it is genuinely undefined hangs
# ktest.pl, hence the DEFINED guard rather than relying on an empty default).
DEFAULTS IF NOT DEFINED ARCH && DEFINED CHROOT
ARCH := ${shell ${THIS_DIR}/bin/cross resolve-arch "${ROOT_DISK}" "" "${CHROOT}"}
KLAB_ARCH := ${ARCH}
DEFAULTS

DEFAULTS IF NOT DEFINED ARCH
ARCH := ${shell ${THIS_DIR}/bin/cross resolve-arch "${ROOT_DISK}"}
KLAB_ARCH := ${ARCH}
DEFAULTS

DEFAULTS IF NOT DEFINED CROSS_COMPILE

DEFAULTS IF ${KLAB_ARCH} == arm64 && DEFINED CROSS_COMPILE_ARM64
CROSS_COMPILE := ${CROSS_COMPILE_ARM64}

DEFAULTS IF ${KLAB_ARCH} == arm && DEFINED CROSS_COMPILE_ARM
CROSS_COMPILE := ${CROSS_COMPILE_ARM}

DEFAULTS IF ${KLAB_ARCH} == powerpc && DEFINED CROSS_COMPILE_POWERPC
CROSS_COMPILE := ${CROSS_COMPILE_POWERPC}

DEFAULTS IF ${KLAB_ARCH} == s390 && DEFINED CROSS_COMPILE_S390
CROSS_COMPILE := ${CROSS_COMPILE_S390}

DEFAULTS IF ${KLAB_ARCH} == riscv && DEFINED CROSS_COMPILE_RISCV
CROSS_COMPILE := ${CROSS_COMPILE_RISCV}

DEFAULTS

DEFAULTS IF NOT DEFINED CROSS_COMPILE
CROSS_COMPILE := ${shell ${THIS_DIR}/bin/cross cross-compile "${KLAB_ARCH}"}
DEFAULTS

DEFAULTS IF NOT DEFINED CHROOT

DEFAULTS IF ${KLAB_ARCH} == x86_64 && DEFINED CHROOT_X86_64
CHROOT := ${CHROOT_X86_64}

DEFAULTS IF ${KLAB_ARCH} == arm64 && DEFINED CHROOT_ARM64
CHROOT := ${CHROOT_ARM64}

DEFAULTS IF ${KLAB_ARCH} == arm && DEFINED CHROOT_ARM
CHROOT := ${CHROOT_ARM}

DEFAULTS IF ${KLAB_ARCH} == powerpc && DEFINED CHROOT_POWERPC
CHROOT := ${CHROOT_POWERPC}

DEFAULTS IF ${KLAB_ARCH} == s390 && DEFINED CHROOT_S390
CHROOT := ${CHROOT_S390}

DEFAULTS IF ${KLAB_ARCH} == riscv && DEFINED CHROOT_RISCV
CHROOT := ${CHROOT_RISCV}

DEFAULTS

# CHROOT is only consumed when CHROOT_BUILD=1 (see bin/chroot/* and
# include/rootfs.conf); it is a directory, keyed by ARCH via setup.conf's
# optional CHROOT_* overrides, same pattern as CROSS_COMPILE_*.
DEFAULTS IF NOT DEFINED CHROOT
CHROOT := ${shell ${THIS_DIR}/bin/cross chroot-dir "${KLAB_ARCH}"}
DEFAULTS

KLAB_BUILD_TARGET := ${shell ${THIS_DIR}/bin/cross build-target "${KLAB_ARCH}"}

# What a *booted guest's own* `uname -m` actually reports for this arch, as
# opposed to KLAB_ARCH's kernel-source-tree-style name (see bin/cross's
# uname_arch for why these differ for everything except x86_64). Not a real
# ktest.pl option, just available as ${KLAB_UNAME_ARCH} for test files (e.g.
# tests/smoke/test) that need to assert against a running guest's identity.
KLAB_UNAME_ARCH := ${shell ${THIS_DIR}/bin/cross uname-arch "${KLAB_ARCH}"}

DEFAULTS IF NOT DEFINED BUILD_TARGET
BUILD_TARGET = ${KLAB_BUILD_TARGET}

DEFAULTS OVERRIDE

ENV := ${ENV} ARCH="${KLAB_ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" BUILD_TARGET="${KLAB_BUILD_TARGET}" CHROOT="${CHROOT}"
