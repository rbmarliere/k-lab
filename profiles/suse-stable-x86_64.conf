# Shared Tumbleweed kernel build settings and x86_64 guest disk.
# Include after defaults.conf; tests must set ARCH := x86_64 first.
INCLUDE ${KLAB_DIR}/include/suse.conf

DEFAULTS OVERRIDE
SUSE_BRANCH = stable
OUTPUT_DIR = ${KLAB_DIR}/tmp/build-suse-stable-x86_64
BUILD_NOCLEAN = 1
ROOT_DISK = ${ROOTS_DIR}/opensuse/tumbleweed/x86_64.img
