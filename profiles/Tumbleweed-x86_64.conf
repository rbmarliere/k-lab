# Shared build: Tumbleweed kernel, Tumbleweed x86_64 userspace and toolchain.
# Include after defaults.conf; tests must set ARCH := x86_64 first.
INCLUDE ${THIS_DIR}/include/suse.conf

DEFAULTS OVERRIDE
BRANCH = stable
OUTPUT_DIR = ${THIS_DIR}/tmp/build-Tumbleweed-x86_64
BUILD_NOCLEAN = 1
ROOT_DISK = /roots/suse/Tumbleweed/x86_64.img
CHROOT_KERNEL = /roots/suse/Tumbleweed/x86_64
