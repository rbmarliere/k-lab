# Shared Tumbleweed kernel build settings and x86_64 guest disk.
# Include after defaults.conf; tests must set ARCH := x86_64 first.
INCLUDE ${THIS_DIR}/include/suse.conf

DEFAULTS OVERRIDE
SUSE_BRANCH = stable
OUTPUT_DIR = ${THIS_DIR}/tmp/build-Tumbleweed-x86_64
BUILD_NOCLEAN = 1
ROOT_DISK = /roots/Tumbleweed/x86_64.img
