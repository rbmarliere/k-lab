# Must point at this checkout.
THIS_DIR := /linux/k-lab
# Linux master branch for ktest.pl
LINUX_GIT := /linux/kernel/master
# Optional SUSE kernel-source checkout used by include/suse.conf
KSOURCE_GIT := /linux/kernel-source
# Optional extra test roots for kt lookup and tab completion.
# Colon-separated, relative paths are resolved from THIS_DIR.
# TEST_DIRS := ../my-private-tests/tests

# Optional cross-toolchain prefix overrides.
# Values must be full compiler prefixes ending in '-', for example:
# CROSS_COMPILE_ARM := /linux/k-lab/tools/armv7-eabihf--glibc--stable-2025.08-1/bin/arm-buildroot-linux-gnueabihf-
#
# CROSS_COMPILE_ARM64 :=
# CROSS_COMPILE_ARM :=
# CROSS_COMPILE_POWERPC :=
# CROSS_COMPILE_S390 :=
# CROSS_COMPILE_RISCV :=

# Optional chroot targets, used only when CHROOT_BUILD=1. The build then
# runs inside that directory via a real chroot, using ITS OWN native
# toolchain (not CROSS_COMPILE_* above), so builds match a target distro
# exactly. Foreign arches are transparently emulated by the host's
# qemu-user/binfmt_misc registration. Values must be directories, for
# example a rootfs tree produced by bin/setup/debootstrap,
# bin/setup/suse-bootstrap, or any other distro rootfs:
# CHROOT_ARM64 := /roots/suse/15.7/aarch64
#
# CHROOT_X86_64 :=
# CHROOT_ARM64 :=
# CHROOT_ARM :=
# CHROOT_POWERPC :=
# CHROOT_S390 :=
# CHROOT_RISCV :=
