# bare SUSE kernel-source repository; each SUSE_BRANCH is a worktree within it
# SUSE_KERNEL_SOURCE_GIT := /path/to/suse/kernel-source

# base directory for guest root filesystems and disk images
# ROOTS_DIR = /roots

# default ltp worktree used by include/ltp.conf
# LTP_SOURCE = /path/to/ltp

# default xfstests worktree used by include/xfstests.conf
# XFSTESTS_SOURCE = /path/to/xfstests-dev

# virtme-ng executable
# VNG = /path/to/vng

# static busybox for the guest architecture
# BUSYBOX = /path/to/busybox/${KLAB_ARCH}/busybox
